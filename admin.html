<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bossy Prints & Design | Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

header {
    background: #111;
    color: white;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

button {
    border: none;
    padding: 11px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.logout {
    background: #e53935;
    color: white;
}

.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 20px;
}

.login-box,
.form-box,
.products-box {
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
    margin-bottom: 25px;
}

.login-box {
    max-width: 450px;
    margin: 80px auto;
}

h2 {
    margin-top: 0;
}

input,
textarea,
select {
    width: 100%;
    padding: 12px;
    margin: 7px 0 15px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.primary {
    background: #111;
    color: white;
}

.cancel {
    background: #ddd;
    margin-left: 8px;
}

.message {
    margin-top: 12px;
    font-weight: bold;
}

.product {
    border: 1px solid #ddd;
    padding: 15px;
    margin-top: 15px;
    border-radius: 8px;
    display: flex;
    gap: 20px;
    align-items: center;
}

.product img {
    width: 110px;
    height: 110px;
    object-fit: cover;
    border-radius: 7px;
    background: #eee;
}

    flex: 1;
}

.product-info h3 {
    margin: 0 0 8px;
}

.product-info p {
    margin: 5px 0;

    background: #1976d2;

@media(max-width:650px) {
    .product {
        flex-direction: column;

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginSection" class="container">
    <div class="login-box">
        <h2>Bossy Prints & Design</h2>
        <p>Admin Login</p>

        <form id="loginForm">
            <label>Email</label>
            <input type="email" id="loginEmail" required>

            <label>Password</label>
            <input type="password" id="loginPassword" required>

            <button class="primary" type="submit">Login</button>

            <div id="loginMessage" class="message"></div>
        </form>
    </div>
</div>


<!-- ADMIN DASHBOARD -->
<div id="dashboardSection" class="hidden">

<header>
    <h1>Bossy Prints & Design — Admin</h1>
    <button class="logout" id="logoutBtn">Logout</button>
</header>

<div class="container">

    <!-- PRODUCT FORM -->
    <div class="form-box">

        <h2 id="formTitle">Add Product</h2>

        <form id="productForm">

            <input type="hidden" id="productId">

            <label>Product / Service Name</label>
            <input type="text" id="productName" placeholder="Example: Custom T-Shirt" required>

            <label>Price (KSh)</label>
            <input type="number" id="productPrice" placeholder="Example: 800">

            <label>Category</label>
            <select id="productCategory">
                <option value="T-Shirt Printing">T-Shirt Printing</option>
                <option value="Graphic Design">Graphic Design</option>
                <option value="Branding">Branding</option>
                <option value="Banners & Posters">Banners & Posters</option>
                <option value="Stickers & Labels">Stickers & Labels</option>
                <option value="Caps & Merchandise">Caps & Merchandise</option>
                <option value="Other">Other</option>
            </select>

            <label>Description</label>
            <textarea id="productDescription"
                placeholder="Describe the product or service"></textarea>

            <label>Image URL</label>
            <input type="url" id="productImage"
                placeholder="https://example.com/image.jpg">

            <button class="primary" type="submit" id="saveBtn">
                Add Product
            </button>

            <button type="button" class="cancel hidden" id="cancelBtn">
                Cancel Edit
            </button>

            <div id="productMessage" class="message"></div>

        </form>

    </div>


    <!-- PRODUCTS -->
    <div class="products-box">

        <h2>Products & Services</h2>

        <div id="productsList">
            Loading products...
        </div>

    </div>

</div>

</div>


<script>

// ================================
// SUPABASE CONNECTION
// ================================

const SUPABASE_URL = "https://jzvuvbzkumkomqdtjkrt.supabase.co";

const SUPABASE_KEY = "sb_publishable_oHVAQtCkJImAQrD2sVjTGA_aWM_nYyl";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ================================
// ELEMENTS
// ================================

const loginSection = document.getElementById("loginSection");
const dashboardSection = document.getElementById("dashboardSection");

const loginForm = document.getElementById("loginForm");
const loginMessage = document.getElementById("loginMessage");

const logoutBtn = document.getElementById("logoutBtn");

const productForm = document.getElementById("productForm");
const productsList = document.getElementById("productsList");

const productMessage = document.getElementById("productMessage");


// ================================
// CHECK LOGIN
// ================================

async function checkLogin() {

    const { data } = await supabaseClient.auth.getSession();

    if (data.session) {
        showDashboard();
    } else {
        showLogin();
    }
}


// ================================
// SHOW LOGIN
// ================================

function showLogin() {

    loginSection.classList.remove("hidden");
    dashboardSection.classList.add("hidden");
}


// ================================
// SHOW DASHBOARD
// ================================

function showDashboard() {

    loginSection.classList.add("hidden");
    dashboardSection.classList.remove("hidden");

    loadProducts();
}


// ================================
// LOGIN
// ================================

loginForm.addEventListener("submit", async function(e) {

    e.preventDefault();

    loginMessage.textContent = "Logging in...";

    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;

    const { error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {

        loginMessage.textContent = "Login failed: " + error.message;

    } else {

        loginMessage.textContent = "";

        showDashboard();
    }

});


// ================================
// LOGOUT
// ================================

logoutBtn.addEventListener("click", async function() {

    await supabaseClient.auth.signOut();

    showLogin();

});


// ================================
// LOAD PRODUCTS
// ================================

async function loadProducts() {

    productsList.innerHTML = "Loading products...";

    const { data, error } = await supabaseClient
        .from("products")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {

        productsList.innerHTML =
            "Error loading products: " + error.message;

        return;
    }

    if (!data || data.length === 0) {

        productsList.innerHTML =
            "<p>No products have been added yet.</p>";

        return;
    }

    productsList.innerHTML = "";

    data.forEach(product => {

        const div = document.createElement("div");

        div.className = "product";

        div.innerHTML = `

            <img
                src="${product.image_url || 'https://via.placeholder.com/200'}"
                alt="${escapeHtml(product.name)}"
                onerror="this.src='https://via.placeholder.com/200'"
            >

            <div class="product-info">

                <h3>${escapeHtml(product.name)}</h3>

                <p><strong>Price:</strong>
                    KSh ${product.price ?? "Contact us"}
                </p>

                <p><strong>Category:</strong>
                    ${escapeHtml(product.category || "")}
                </p>

                <p>
                    ${escapeHtml(product.description || "")}
                </p>

                <button
                    class="edit"
                    onclick="editProduct('${product.id}')">
                    Edit
                </button>

                <button
                    class="delete"
                    onclick="deleteProduct('${product.id}')">
                    Delete
                </button>

            </div>
        `;

        productsList.appendChild(div);

    });

}


// ================================
// ADD / UPDATE PRODUCT
// ================================

productForm.addEventListener("submit", async function(e) {

    e.preventDefault();

    productMessage.textContent = "Saving...";

    const id = document.getElementById("productId").value;

    const product = {

        name: document.getElementById("productName").value,

        price: document.getElementById("productPrice").value || null,

        description:
            document.getElementById("productDescription").value,

        image_url:
            document.getElementById("productImage").value,

        category:
            document.getElementById("productCategory").value
    };


    let result;


    if (id) {

        result = await supabaseClient
            .from("products")
            .update(product)
            .eq("id", id);

    } else {

        result = await supabaseClient
            .from("products")
            .insert([product]);

    }


    if (result.error) {

        productMessage.textContent =
            "Error: " + result.error.message;

        return;
    }


    productMessage.textContent = "Saved successfully.";

    resetForm();

    loadProducts();

});


// ================================
// EDIT PRODUCT
// ================================

async function editProduct(id) {

    const { data, error } = await supabaseClient
        .from("products")
        .select("*")
        .eq("id", id)
        .single();

    if (error) {

        alert(error.message);
        return;
    }


    document.getElementById("productId").value = data.id;

    document.getElementById("productName").value =
        data.name || "";

    document.getElementById("productPrice").value =
        data.price || "";

    document.getElementById("productDescription").value =
        data.description || "";

    document.getElementById("productImage").value =
        data.image_url || "";

    document.getElementById("productCategory").value =
        data.category || "Other";


    document.getElementById("formTitle").textContent =
        "Edit Product";

    document.getElementById("saveBtn").textContent =
        "Update Product";

    document.getElementById("cancelBtn")
        .classList.remove("hidden");

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


// ================================
// DELETE PRODUCT
// ================================

async function deleteProduct(id) {

    const confirmed =
        confirm("Are you sure you want to delete this product?");

    if (!confirmed) return;


    const { error } = await supabaseClient
        .from("products")
        .delete()
        .eq("id", id);


    if (error) {

        alert("Delete failed: " + error.message);

        return;
    }


    loadProducts();

}


// ================================
// CANCEL EDIT
// ================================

document.getElementById("cancelBtn")
    .addEventListener("click", resetForm);


function resetForm() {

    productForm.reset();

    document.getElementById("productId").value = "";

    document.getElementById("formTitle").textContent =
        "Add Product";

    document.getElementById("saveBtn").textContent =
        "Add Product";

    document.getElementById("cancelBtn")
        .classList.add("hidden");

}


// ================================
// BASIC HTML ESCAPE
// ================================

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


// ================================
// START
// ================================

checkLogin();

</script>

</body>
</html>
