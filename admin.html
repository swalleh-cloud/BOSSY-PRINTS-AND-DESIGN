<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bossy Prints & Design | Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
    color:#222;
}

/* =========================
   LOGIN
========================= */

#loginScreen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111;
    padding:20px;
}

.loginBox{
    width:100%;
    max-width:420px;
    background:white;
    padding:40px;
    border-radius:18px;
    box-shadow:0 20px 50px rgba(0,0,0,.3);
}

.loginLogo{
    text-align:center;
    margin-bottom:30px;
}

.loginLogo h1{
    font-size:28px;

}

.loginLogo p{

.loginBox label{

.loginBox input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:9px;
    font-size:15px;
}

.loginBtn{
    width:100%;

.loginBtn:hover{

/* =========================

========================= */

}

.sidebar{
    position:fixed;

}

.logo{
    text-align:center;
    padding:10px;
    margin-bottom:30px;
}

.logo h2{
    font-size:23px;
    font-weight:900;
}

.logo p{
    font-size:10px;
    color:#aaa;
    margin-top:5px;

}

.menu{
    display:flex;

    gap:7px;
}

.menu button{

.menu button:hover,

.main{

}

.topbar{

}

.topbar h1{
    font-size:28px;
}

    color:#777;

}

    display:none;
    border:none;

    display:none;

/* =========================
   SECTIONS
========================= */

.section{
    display:none;
}

.section.active{
    display:block;
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;

}

.statCard{
    background:white;

    box-shadow:0 4px 15px rgba(0,0,0,.05);

    display:block;

   CARDS
========================= */

.card{
    background:white;

    box-shadow:0 4px 15px rgba(0,0,0,.05);
    margin-bottom:25px;
}

.cardHeader{

}

.cardHeader h2{
    font-size:20px;
}

/* =========================
   FORMS
========================= */

.formGrid{
    display:grid;

    gap:18px;
}

.formGroup{
    display:flex;
    flex-direction:column;

    grid-column:1/-1;

.btnPrimary{
    background:#111;

.btnSecondary{

#previewImg{

/* =========================

========================= */

.toolbar{

.toolbar input{

}

.productsGrid{

}

.productCard{

}

    width:100%;

}

.productInfo{
    padding:18px;
}

.productInfo h3{
    font-size:18px;

}

.productPrice{

.productCategory{

.productDescription{

}

.productActions{

    gap:8px;
}

.productActions button{
    flex:1;
}

/* =========================
   RECENT PRODUCTS
========================= */

.recentList{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.recentItem{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px;
    background:#f7f7f7;
    border-radius:8px;
}

.recentItem img{
    width:55px;
    height:55px;
    object-fit:cover;
    border-radius:7px;
}

.recentItem strong{
    display:block;
    margin-bottom:4px;
}

.recentItem span{
    color:#777;
    font-size:12px;
}

/* =========================
   EMPTY
========================= */

.empty{
    text-align:center;
    padding:40px;
    color:#777;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1000px){

    .productsGrid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:800px){

    .sidebar{
        transform:translateX(-100%);
        transition:.3s;
    }

    .sidebar.open{
        transform:translateX(0);

    .main{

    }

    .mobileMenu{
        display:block;
    }

    .overlay{
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.5);
        z-index:999;
    }

    .overlay.open{
        display:block;
    }

    .stats{
        grid-template-columns:1fr;
    }

}

@media(max-width:650px){

    .topbar{
        gap:15px;
    }

    .topbar h1{
        font-size:22px;
    }

    .formGrid{
        grid-template-columns:1fr;
    }

    .formGroup.full{
        grid-column:auto;
    }

    .productsGrid{
        grid-template-columns:1fr;
    }

    .toolbar{
        flex-direction:column;
    }

}

</style>

</head>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://jzvuvbzkumkomqdtjkrt.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_oHVAQtCkJImAQrD2sVjTGA_aWM_nYyl";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =========================
   VARIABLES
========================= */

let allProducts = [];



const loginScreen =
    document.getElementById(
        "loginScreen"
    );


const dashboard =
    document.getElementById(
        "dashboard"
    );


const loginForm =
    document.getElementById(
        "loginForm"
    );


const loginMessage =
    document.getElementById(
        "loginMessage"
    );


const productForm =
    document.getElementById(
        "productForm"
    );


const productMessage =
    document.getElementById(
        "productMessage"
    );



/* =========================
   LOGIN
========================= */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const email =
            document.getElementById(
                "loginEmail"
            ).value.trim();


        const password =
            document.getElementById(
                "loginPassword"
            ).value;


        loginMessage.style.display =
            "block";


        loginMessage.style.background =
            "#f0f0f0";


        loginMessage.style.color =
            "#222";


        loginMessage.textContent =
            "Logging in...";


        const { data, error } =
            await supabaseClient.auth
                .signInWithPassword({
                    email:email,
                    password:password
                });


        if(error){

            loginMessage.style.background =
                "#ffe5e5";


            loginMessage.style.color =
                "#a00000";


            loginMessage.textContent =
                error.message;


            return;
        }


        if(data.session){

            loginScreen.style.display =
                "none";


            dashboard.style.display =
                "block";


            await loadProducts();

        }

    }
);



/* =========================
   CHECK LOGIN SESSION
========================= */

async function checkSession(){

    const { data } =
        await supabaseClient.auth
            .getSession();


    if(data.session){

        loginScreen.style.display =
            "none";


        dashboard.style.display =
            "block";


        await loadProducts();

    }

}


checkSession();



/* =========================
   LOGOUT
========================= */

document
    .getElementById("logoutButton")
    .addEventListener(
        "click",
        async function(){

            await supabaseClient.auth
                .signOut();


            dashboard.style.display =
                "none";


            loginScreen.style.display =
                "flex";

        }
    );



/* =========================
   NAVIGATION
========================= */

document
    .querySelectorAll(
        ".menu button[data-section]"
    )
    .forEach(
        function(button){

            button.addEventListener(
                "click",
                function(){

                    const section =
                        button.dataset.section;


                    document
                        .querySelectorAll(
                            ".menu button"
                        )
                        .forEach(
                            function(item){
                                item.classList
                                    .remove("active");
                            }
                        );


                    button.classList
                        .add("active");


                    showSection(
                        section
                            .replace(
                                "Section",
                                ""
                            )
                    );


                    closeMobileMenu();

                }
            );

        }
    );



function showSection(section){

    document
        .querySelectorAll(".section")
        .forEach(
            function(item){

                item.classList
                    .remove("active");

            }
        );


    const target =
        document.getElementById(
            section + "Section"
        );


    if(target){

        target.classList
            .add("active");

    }


    const titles = {

        dashboard:
            "Dashboard",

        add:
            "Add Product",

        products:
            "Products"

    };


    document.getElementById(
        "pageTitle"
    ).textContent =
        titles[section] ||
        "Dashboard";


    if(section === "products"){

        renderProducts();

    }

}



/* =========================
   VIEW WEBSITE
========================= */

document
    .getElementById("viewWebsite")
    .addEventListener(
        "click",
        function(){

            window.open(
                "https://swalleh-cloud.github.io/BOSSY-PRINTS-AND-DESIGN/",
                "_blank"
            );

        }
    );



/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

    const { data, error } =
        await supabaseClient
            .from("products")
            .select("*")
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


    if(error){

        console.error(error);


        alert(
            "Could not load products: " +
            error.message
        );


        return;

    }


    allProducts =
        data || [];


    updateDashboard();


    renderProducts();


    renderRecentProducts();

}



/* =========================
   DASHBOARD STATS
========================= */

function updateDashboard(){

    document.getElementById(
        "totalProducts"
    ).textContent =
        allProducts.length;


    const categories =
        new Set(
            allProducts
                .map(
                    item =>
                        item.category
                )
                .filter(Boolean)
        );


    document.getElementById(
        "totalCategories"
    ).textContent =
        categories.size;

}



/* =========================
   RECENT PRODUCTS
========================= */

function renderRecentProducts(){

    const container =
        document.getElementById(
            "recentProducts"
        );


    if(
        allProducts.length === 0
    ){

        container.innerHTML =
            `
            <div class="empty">
                No products have been added yet.
            </div>
            `;

        return;

    }


    const recent =
        allProducts.slice(0,5);


    container.innerHTML =
        recent
            .map(
                function(product){

                    const image =
                        product.image_url ||
                        "https://via.placeholder.com/100";


                    return `

                    <div class="recentItem">

                        <img
                            src="${escapeHtml(image)}"
                            alt=""
                        >

                        <div>

                            <strong>
                                ${escapeHtml(
                                    product.name || ""
                                )}
                            </strong>

                            <span>
                                ${escapeHtml(
                                    product.category || ""
                                )}
                            </span>

                        </div>

                    </div>

                    `;

                }
            )
            .join("");

}



/* =========================
   RENDER PRODUCTS
========================= */

function renderProducts(){

    const grid =
        document.getElementById(
            "productsGrid"
        );


    const search =
        document.getElementById(
            "searchInput"
        ).value
        .toLowerCase()
        .trim();


    const category =
        document.getElementById(
            "filterCategory"
        ).value;


    const filtered =
        allProducts.filter(
            function(product){

                const name =
                    String(
                        product.name || ""
                    )
                    .toLowerCase();


                const description =
                    String(
                        product.description || ""
                    )
                    .toLowerCase();


                const matchesSearch =
                    !search ||
                    name.includes(search) ||
                    description.includes(search);


                const matchesCategory =
                    !category ||
                    product.category === category;


                return (
                    matchesSearch &&
                    matchesCategory
                );

            }
        );


    if(filtered.length === 0){

        grid.innerHTML =
            `
            <div class="empty">
                No products found.
            </div>
            `;

        return;

    }


    grid.innerHTML =
        filtered
            .map(
                function(product){

                    const image =
                        product.image_url ||
                        "https://via.placeholder.com/600x400";


                    return `

                    <div class="productCard">

                        <img
                            class="productImage"
                            src="${escapeHtml(image)}"
                            alt="${escapeHtml(
                                product.name || ""
                            )}"
                        >


                        <div class="productInfo">

                            <h3>
                                ${escapeHtml(
                                    product.name || ""
                                )}
                            </h3>


                            <div class="productPrice">

                                ${
                                    escapeHtml(
                                        product.price || ""
                                    )
                                }

                            </div>


                            <div class="productCategory">

                                ${
                                    escapeHtml(
                                        product.category || ""
                                    )
                                }

                            </div>


                            <div class="productDescription">

                                ${
                                    escapeHtml(
                                        product.description || ""
                                    )
                                }

                            </div>


                            <div class="productActions">

                                <button
                                    class="btn btnSecondary"
                                    onclick="editProduct('${product.id}')"
                                >
                                    Edit
                                </button>


                                <button
                                    class="btn btnDanger"
                                    onclick="deleteProduct('${product.id}')"
                                >
                                    Delete
                                </button>

                            </div>

                        </div>

                    </div>

                    `;

                }
            )
            .join("");

}

/* =========================
   ADD / UPDATE PRODUCT
========================= */

productForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const id =
            document
                .getElementById(
                    "productId"
                )
                .value;


        const name =
            document
                .getElementById(
                    "productName"
                )
                .value
                .trim();


        const price =
            document
                .getElementById(
                    "productPrice"
                )
                .value
                .trim();


        const category =
            document
                .getElementById(
                    "productCategory"
                )
                .value
                .trim();


        const description =
            document
                .getElementById(
                    "productDescription"
                )
                .value
                .trim();


        const imageFile =
            document
                .getElementById(
                    "productImage"
                )
                .files[0];


        showProductMessage(
            "Saving product...",
            "success"
        );


        let imageUrl = null;


        /* =========================
           KEEP OLD IMAGE WHEN EDITING
        ========================= */

        if(id){

            const oldProduct =
                allProducts.find(
                    item =>
                        String(item.id) ===
                        String(id)
                );


            if(oldProduct){

                imageUrl =
                    oldProduct.image_url ||
                    null;

            }

        }



        /* =========================
           UPLOAD NEW IMAGE
        ========================= */

        if(imageFile){

            const extension =
                imageFile.name
                    .split(".")
                    .pop()
                    .toLowerCase();


            const fileName =
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .substring(2,8) +
                "." +
                extension;


            const filePath =
                fileName;


            const { error:uploadError } =
                await supabaseClient
                    .storage
                    .from("product-images")
                    .upload(
                        filePath,
                        imageFile,
                        {
                            upsert:false
                        }
                    );


            if(uploadError){

                showProductMessage(
                    "Image upload failed: " +
                    uploadError.message,
                    "error"
                );

                return;

            }


            const { data:urlData } =
                supabaseClient
                    .storage
                    .from("product-images")
                    .getPublicUrl(
                        filePath
                    );


            imageUrl =
                urlData.publicUrl;

        }



        /* =========================
           PRODUCT DATA
        ========================= */

        const productData = {

            name:name,

            price:price,

            category:category,

            description:description,

            image_url:imageUrl

        };



        /* =========================
           UPDATE
        ========================= */

        if(id){

            const { error } =
                await supabaseClient
                    .from("products")
                    .update(productData)
                    .eq("id",id);


            if(error){

                showProductMessage(
                    "Update failed: " +
                    error.message,
                    "error"
                );

                return;

            }


            showProductMessage(
                "Product updated successfully.",
                "success"
            );

        }


        /* =========================
           INSERT
        ========================= */

        else{

            const { error } =
                await supabaseClient
                    .from("products")
                    .insert([
                        productData
                    ]);


            if(error){

                showProductMessage(
                    "Product could not be added: " +
                    error.message,
                    "error"
                );

                return;

            }


            showProductMessage(
                "Product added successfully.",
                "success"
            );

        }



        await loadProducts();


        setTimeout(
            function(){

                resetForm();

                showSection("products");

            },
            800
        );

    }
);

async function editProduct(id){

    const product =
        allProducts.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if(!product){

        alert(
            "Product could not be found."
        );

        return;

    }


    document
        .getElementById("productId")
        .value =
        product.id;


    document
        .getElementById("productName")
        .value =
        product.name || "";


    document
        .getElementById("productPrice")
        .value =
        product.price || "";


    document
        .getElementById("productCategory")
        .value =
        product.category || "";


    document
        .getElementById("productDescription")
        .value =
        product.description || "";


    document
        .getElementById("productImage")
        .value =
        "";


    document
        .getElementById("formTitle")
        .textContent =
        "Edit Product";


    document
        .getElementById("saveBtn")
        .textContent =
        "Update Product";


    if(product.image_url){

        document
            .getElementById("previewImg")
            .src =
            product.image_url;


        document
            .getElementById("imagePreview")
            .style.display =
            "block";

    }
    else{

        document
            .getElementById("imagePreview")
            .style.display =
            "none";

    }


    showSection("add");


    document
        .querySelectorAll(
            ".menu button"

        )
        .classList
        .add("active");

}



/* =========================
   DELETE PRODUCT
========================= */

async function deleteProduct(id){

    const confirmed =
        confirm(
            "Are you sure you want to delete this product?"
        );


    if(!confirmed){

        return;

    }


    const product =
        allProducts.find(
            item =>
                String(item.id) ===
                String(id)
        );


    const { error } =
        await supabaseClient
            .from("products")
            .delete()
            .eq("id",id);


    if(error){

        alert(
            "Could not delete product: " +
            error.message
        );

        return;

    }


    /*
       Delete image from storage when possible.
    */

    if(
        product &&
        product.image_url
    ){

        try{

            const url =
                product.image_url;


            const marker =
                "/storage/v1/object/public/product-images/";


            const index =
                url.indexOf(marker);


            if(index !== -1){

                const filePath =
                    decodeURIComponent(
                        url.substring(
                            index +
                            marker.length
                        )
                    );


                await supabaseClient
                    .storage
                    .from("product-images")
                    .remove([
                        filePath
                    ]);

            }

        }
        catch(error){

            console.log(
                "Image deletion skipped.",
                error
            );

        }

    }


    await loadProducts();


    alert(
        "Product deleted successfully."
    );

}

/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}
