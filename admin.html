<style>

    font-family: Arial, sans-serif;

}

}

    margin: 0;

}

@media(max-width:650px) {

    .product {
        flex-direction: column;
        align-items: flex-start;
    }

    .product img {
        width: 100%;
        height: 180px;
    }

    .website-btn,
    .logout {
        padding: 10px 13px;
    }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginSection" class="container">

    <div class="form-box" style="max-width:450px;margin:80px auto;">

        <h2>Bossy Prints & Design</h2>

        <p>Admin Login</p>

        <form id="loginForm">

            <label>Email</label>

            <input
                type="email"
                id="loginEmail"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="loginPassword"
                required
            >

            <button class="primary" type="submit">
                Login
            </button>

            <div id="loginMessage" class="message"></div>

        </form>

    </div>

</div>


<!-- ================= DASHBOARD ================= -->

<div id="dashboardSection" class="hidden">

<header>

    <h1>Bossy Prints & Design — Admin</h1>

    <div class="header-buttons">

        <!-- BACK TO WEBSITE -->
        <a
            href="index.html"
            class="website-btn"
        >
            ← Back to Website
        </a>

        <!-- LOGOUT -->
        <button
            class="logout"
            id="logoutBtn"
        >
            Logout
        </button>

    </div>

</header>


<div class="container">

<!-- ================= PRODUCT FORM ================= -->

<div class="form-box">

    <h2 id="formTitle">
        Add Product
    </h2>

    <form id="productForm">

        <input
            type="hidden"
            id="productId"
        >


        <label>
            Product / Service Name
        </label>

        <input
            type="text"
            id="productName"
            placeholder="Example: Custom T-Shirt"
            required
        >


        <label>
            Price (KSh)
        </label>

        <input
            type="number"
            id="productPrice"
            placeholder="Example: 800"
        >


        <label>
            Category
        </label>

        <select id="productCategory">

            <option value="T-Shirt Printing">
                T-Shirt Printing
            </option>

            <option value="Graphic Design">
                Graphic Design
            </option>

            <option value="Branding">
                Branding
            </option>

            <option value="Banners & Posters">
                Banners & Posters
            </option>

            <option value="Stickers & Labels">
                Stickers & Labels
            </option>

            <option value="Caps & Merchandise">
                Caps & Merchandise
            </option>

            <option value="Other">
                Other
            </option>

        </select>


        <label>
            Description
        </label>

        <textarea
            id="productDescription"
            placeholder="Describe the product or service"
        ></textarea>


        <label>
            Product Image
        </label>

        <input
            type="file"
            id="productImageFile"
            accept="image/*"
        >


        <img
            id="imagePreview"
            class="image-preview"
            alt="Image preview"
        >


        <button
            class="primary"
            type="submit"
            id="saveBtn"
        >
            Add Product
        </button>


        <button
            type="button"
            class="cancel hidden"
            id="cancelBtn"
        >
            Cancel Edit
        </button>


        <div
            id="productMessage"
            class="message"
        ></div>

    </form>

</div>


<!-- ================= PRODUCTS ================= -->

<div class="products-box">

    <h2>
        Products & Services
    </h2>

    <div id="productsList">
        Loading products...
    </div>

</div>

</div>

</div>


<script>

// =====================================
// SUPABASE CONNECTION
// =====================================

const SUPABASE_URL =
"https://jzvuvbzkumkomqdtjkrt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_oHVAQtCkJImAQrD2sVjTGA_aWM_nYyl";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// =====================================
// ELEMENTS
// =====================================

const loginSection =
document.getElementById("loginSection");

const dashboardSection =
document.getElementById("dashboardSection");

const loginForm =
document.getElementById("loginForm");

const loginMessage =
document.getElementById("loginMessage");

const logoutBtn =
document.getElementById("logoutBtn");

const productForm =
document.getElementById("productForm");

const productsList =
document.getElementById("productsList");

const productMessage =
document.getElementById("productMessage");

const imageFile =
document.getElementById("productImageFile");

const imagePreview =
document.getElementById("imagePreview");


// =====================================
// CHECK LOGIN
// =====================================

async function checkLogin() {

    const { data } =
    await supabaseClient.auth.getSession();

    if (data.session) {

        showDashboard();

    } else {

        showLogin();

    }

}


// =====================================
// SHOW LOGIN
// =====================================

function showLogin() {

    loginSection.classList.remove("hidden");

    dashboardSection.classList.add("hidden");

}


// =====================================
// SHOW DASHBOARD
// =====================================

function showDashboard() {

    loginSection.classList.add("hidden");

    dashboardSection.classList.remove("hidden");

    loadProducts();

}


// =====================================
// LOGIN
// =====================================

loginForm.addEventListener(
"submit",
async function(e) {

    e.preventDefault();

    loginMessage.textContent =
    "Logging in...";


    const email =
    document.getElementById("loginEmail").value;

    const password =
    document.getElementById("loginPassword").value;


    const { error } =
    await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

    });


    if (error) {

        loginMessage.textContent =
        "Login failed: " + error.message;

    } else {

        loginMessage.textContent = "";

        showDashboard();

    }

});


// =====================================
// LOGOUT
// =====================================

logoutBtn.addEventListener(
"click",
async function() {

    await supabaseClient.auth.signOut();

    showLogin();

});


// =====================================
// IMAGE PREVIEW
// =====================================

imageFile.addEventListener(
"change",
function() {

    const file = this.files[0];

    if (!file) {

        imagePreview.style.display =
        "none";

        return;

    }


    const reader =
    new FileReader();


    reader.onload = function(e) {

        imagePreview.src =
        e.target.result;

        imagePreview.style.display =
        "block";

    };


    reader.readAsDataURL(file);

});


// =====================================
// UPLOAD IMAGE
// =====================================

async function uploadImage(file) {

    if (!file) {

        return null;

    }


    const extension =
    file.name.split(".").pop();


    const fileName =
    Date.now() +
    "-" +
    Math.random()
        .toString(36)
        .substring(2) +
    "." +
    extension;


    const filePath =
    "products/" + fileName;


    const { error } =
    await supabaseClient.storage
        .from("product-images")
        .upload(
            filePath,
            file,
            {
                cacheControl: "3600",
                upsert: false
            }
        );


    if (error) {

        throw error;

    }


    const { data } =
    supabaseClient.storage
        .from("product-images")
        .getPublicUrl(filePath);


    return data.publicUrl;

}


// =====================================
// LOAD PRODUCTS
// =====================================

async function loadProducts() {

    productsList.innerHTML =
    "Loading products...";


    const { data, error } =
    await supabaseClient
        .from("products")
        .select("*")
        .order(
            "created_at",
            { ascending: false }
        );


    if (error) {

        productsList.innerHTML =
        "Error: " + error.message;

        return;

    }


    if (!data || data.length === 0) {

        productsList.innerHTML =
        "<p>No products added yet.</p>";

        return;

    }


    productsList.innerHTML = "";


    data.forEach(product => {

        const div =
        document.createElement("div");

        div.className =
        "product";


        const image =
        product.image_url ||
        "https://via.placeholder.com/200";


        div.innerHTML = `

            <img
                src="${image}"
                alt="${escapeHtml(product.name)}"
            >

            <div class="product-info">

                <h3>
                    ${escapeHtml(product.name)}
                </h3>

                <p>
                    <strong>Price:</strong>
                    KSh ${product.price ?? "Contact us"}
                </p>

                <p>
                    <strong>Category:</strong>
                    ${escapeHtml(product.category || "")}
                </p>

                <p>
                    ${escapeHtml(
                        product.description || ""
                    )}
                </p>

                <button
                    class="edit"
                    onclick="editProduct('${product.id}')"
                >
                    Edit
                </button>

                <button
                    class="delete"
                    onclick="deleteProduct('${product.id}')"
                >
                    Delete
                </button>

            </div>

        `;


        productsList.appendChild(div);

    });

}


// =====================================
// ADD / UPDATE PRODUCT
// =====================================

productForm.addEventListener(
"submit",
async function(e) {

    e.preventDefault();


    productMessage.textContent =
    "Saving product...";


    const id =
    document.getElementById("productId").value;


    const file =
    imageFile.files[0];


    let imageUrl = null;


    try {

        // Upload new image if selected
        if (file) {

            productMessage.textContent =
            "Uploading image...";

            imageUrl =
            await uploadImage(file);

        }


        const product = {

            name:
            document.getElementById(
                "productName"
            ).value,

            price:
            document.getElementById(
                "productPrice"
            ).value || null,

            description:
            document.getElementById(
                "productDescription"
            ).value,

            category:
            document.getElementById(
                "productCategory"
            ).value

        };


        // Only replace image when
        // a new one was uploaded

        if (imageUrl) {

            product.image_url =
            imageUrl;

        }


        let result;


        if (id) {

            result =
            await supabaseClient
                .from("products")
                .update(product)
                .eq("id", id);

        } else {

            result =
            await supabaseClient
                .from("products")
                .insert([product]);

        }


        if (result.error) {

            throw result.error;

        }


        productMessage.textContent =
        "Product saved successfully.";


        resetForm();


        loadProducts();

    }


    catch (error) {

        productMessage.textContent =
        "Error: " + error.message;

    }

});


// =====================================
// EDIT PRODUCT
// =====================================

async function editProduct(id) {

    const { data, error } =
    await supabaseClient
        .from("products")
        .select("*")
        .eq("id", id)
        .single();


    if (error) {

        alert(error.message);

        return;

    }


    document.getElementById(
        "productId"
    ).value =
    data.id;


    document.getElementById(
        "productName"
    ).value =
    data.name || "";


    document.getElementById(
        "productPrice"
    ).value =
    data.price || "";


    document.getElementById(
        "productDescription"
    ).value =
    data.description || "";


    document.getElementById(
        "productCategory"
    ).value =
    data.category || "Other";


    if (data.image_url) {

        imagePreview.src =
        data.image_url;

        imagePreview.style.display =
        "block";

    }


    document.getElementById(
        "formTitle"
    ).textContent =
    "Edit Product";


    document.getElementById(
        "saveBtn"
    ).textContent =
    "Update Product";


    document.getElementById(
        "cancelBtn"
    ).classList.remove("hidden");


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


// =====================================
// DELETE PRODUCT
// =====================================

async function deleteProduct(id) {

    if (!confirm(
        "Are you sure you want to delete this product?"
    )) {

        return;

    }


    const { error } =
    await supabaseClient
        .from("products")
        .delete()
        .eq("id", id);


    if (error) {

        alert(
            "Delete failed: " +
            error.message
        );

        return;

    }


    loadProducts();

}


// =====================================
// RESET FORM
// =====================================

document.getElementById(
    "cancelBtn"
)
.addEventListener(
    "click",
    resetForm
);


function resetForm() {

    productForm.reset();


    document.getElementById(
        "productId"
    ).value =
    "";


    document.getElementById(
        "formTitle"
    ).textContent =
    "Add Product";


    document.getElementById(
        "saveBtn"
    ).textContent =
    "Add Product";


    document.getElementById(
        "cancelBtn"
    ).classList.add("hidden");


    imagePreview.style.display =
    "none";


    imagePreview.src =
    "";

}


// =====================================
// ESCAPE HTML
// =====================================

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


// =====================================
// START
// =====================================

checkLogin();

</script>

</body>
</html>
```
